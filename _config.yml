# Site identity
title: My Tech Blog
tagline: Cloud • DevOps • Security
url: https://<your-site>.netlify.app
baseurl: ""                      # keep empty on Netlify
timezone: America/Chicago
lang: en

# Use Chirpy via remote_theme
remote_theme: cotes2020/jekyll-theme-chirpy

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-archives

# Pagination (already working)
paginate: 10
paginate_path: "/page:num/"

# Archives (categories & tags)
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# Your other Chirpy settings…
# theme_mode: dark


# Chirpy options
theme_mode: dark                 # force dark
toc: true

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Sass (where your override lives)
sass:
  sass_dir: assets/css

# Markdown
kramdown:
  input: GFM


