# Site identity
title: My Tech Blog
tagline: Cloud • DevOps • Security
url: https://<your-site>.netlify.app
baseurl: ""                      # keep empty on Netlify
timezone: America/Chicago
lang: en

# Use Chirpy via remote_theme
remote_theme: cotes2020/jekyll-theme-chirpy

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

# Chirpy options
theme_mode: dark                 # force dark
toc: true
paginate: 10

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Sass (where your override lives)
sass:
  sass_dir: assets/css

# Markdown
kramdown:
  input: GFM

# Don’t ship build/dev files
exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - README.md
  - .github
